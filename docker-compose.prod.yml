# Production: docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.prod.yml up -d
services:
  keycloak:
    # production mode instead of start-dev; test users are removed (realm-prod is generated by scripts/deploy.sh)
    command: ["start", "--import-realm"]
    ports: !reset []
    environment:
      KC_HOSTNAME: ${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - ./keycloak/realm-prod:/opt/keycloak/data/import:ro

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
