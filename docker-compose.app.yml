# Full stack: docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/library_db
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD}
      # must equal the "iss" claim of tokens: the public address of Keycloak
      JWT_ISSUER_URI: ${PUBLIC_URL:-http://localhost}/auth/realms/library
      # keys are fetched over the internal network
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/library/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - keycloak
    networks:
      - internal
      - edge

  keycloak:
    environment:
      KC_PROXY_HEADERS: xforwarded
